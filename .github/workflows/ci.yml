name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture dependency advisory details
        run: |
          mkdir -p artifacts
          npm audit --json --audit-level=high > artifacts/npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const raw = fs.readFileSync("artifacts/npm-audit.json", "utf8").replace(/^\\uFEFF/, "");
          const report = JSON.parse(raw);
          const counts = report.metadata?.vulnerabilities;
          if (!counts) {
            console.error("npm audit returned no vulnerability metadata; refusing an unverified pass.");
            process.exit(2);
          }
          console.log(JSON.stringify(counts));
          if (counts.high > 0 || counts.critical > 0) {
            console.error("High or critical dependency advisories block CI.");
            process.exit(1);
          }
          NODE
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            test-results/**/*.png
            playwright-report/
            artifacts/npm-audit.json
          if-no-files-found: error
          retention-days: 14
